name: Refresh cached vulnerability data
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the complete refreshed snapshot to Vercel
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: vulnerability-cache-production
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write # Remove older verified cache artifacts after saving replacements.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: cache/vulnerabilities.sqlite3
          key: nvd-sqlite-v1-2020-2026-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvd-sqlite-v1-2020-2026-
      - name: Find backup when rolling cache was evicted
        if: steps.cache.outputs.cache-matched-key == ''
        id: backup
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const expected = context.payload.repository;
            for await (const page of github.paginate.iterator(github.rest.actions.listArtifactsForRepo, {...repo, name: 'nvd-sqlite-backup-v1', per_page: 100})) {
              for (const artifact of page.data) {
                const run = artifact.workflow_run;
                if (artifact.expired || artifact.name !== 'nvd-sqlite-backup-v1' ||
                    !run || run.head_branch !== expected.default_branch ||
                    run.repository_id !== expected.id || run.head_repository_id !== expected.id) continue;
                const {data: origin} = await github.rest.actions.getWorkflowRun({...repo, run_id: run.id});
                if (origin.path !== '.github/workflows/refresh.yml' ||
                    !['schedule', 'workflow_dispatch'].includes(origin.event)) continue;
                core.setOutput('id', String(artifact.id));
                return;
              }
            }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.backup.outputs.id != ''
        with:
          artifact-ids: ${{ steps.backup.outputs.id }}
          github-token: ${{ github.token }}
          path: cache
          merge-multiple: true
      - name: Restore backup
        if: steps.backup.outputs.id != ''
        run: python scripts/cache_backup.py restore
      - run: python -m unittest discover -s tests -v
      - name: Sync NVD (bootstrap once; modified records afterwards)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python cvefetcher.py
      - name: Sync CISA KEV
        run: python fetch_cisakev.py
      - name: Export complete dashboard snapshot
        run: python export_dashboard.py
      - name: Save resumable cache, including after an interrupted import
        if: always() && hashFiles('cache/vulnerabilities.sqlite3') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache/vulnerabilities.sqlite3
          key: nvd-sqlite-v1-2020-2026-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Create consistent compressed backup
        if: always() && hashFiles('cache/vulnerabilities.sqlite3') != ''
        run: python scripts/cache_backup.py backup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('cache/vulnerabilities.sqlite3.gz') != ''
        with:
          name: nvd-sqlite-backup-v1
          path: cache/vulnerabilities.sqlite3.gz
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-data
          path: public/data
          retention-days: 1
      - name: Retain two cache backups and one dashboard snapshot
        if: always() && hashFiles('cache/vulnerabilities.sqlite3.gz') != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const expected = context.payload.repository;
            for (const [name, limit] of [['nvd-sqlite-backup-v1', 2], ['dashboard-data', 1]]) {
              const verified = [];
              for await (const page of github.paginate.iterator(github.rest.actions.listArtifactsForRepo, {...repo, name, per_page: 100})) {
                for (const artifact of page.data) {
                  const run = artifact.workflow_run;
                  if (artifact.expired || artifact.name !== name || !run ||
                      run.head_branch !== expected.default_branch || run.repository_id !== expected.id ||
                      run.head_repository_id !== expected.id) continue;
                  const {data: origin} = await github.rest.actions.getWorkflowRun({...repo, run_id: run.id});
                  if (origin.path === '.github/workflows/refresh.yml' && ['schedule', 'workflow_dispatch'].includes(origin.event)) verified.push(artifact);
                }
              }
              verified.sort((a, b) => b.id - a.id);
              // A failed upload must not trigger deletion of the previous backup.
              if (!verified.some(a => a.workflow_run.id === context.runId)) continue;
              for (const artifact of verified.slice(limit)) await github.rest.actions.deleteArtifact({...repo, artifact_id: artifact.id});
            }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Build and publish to Vercel
        if: github.event_name == 'schedule' || inputs.deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@62.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@62.0.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@62.0.0 deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
